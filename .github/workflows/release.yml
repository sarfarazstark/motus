name: Release

on:
  # Manual only: pushing a tag builds nothing, so a release is always a deliberate click.
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the built installers as a release
        type: boolean
        default: false
      source_ref:
        description: Branch, tag or SHA of the source repository to build
        type: string
        default: main

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}
    env:
      # Set a repository secret named SOURCE_REPO (owner/repo). A secret rather than a
      # variable: the checkout step prints the repository URL, and only secret values are
      # masked in the log.
      SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            artifact: windows
          - os: macos-latest
            platform: mac
            artifact: macos
          - os: ubuntu-latest
            platform: linux
            artifact: linux

    steps:
      - name: Check the source repository is configured
        shell: bash
        run: |
          if [ -z "$SOURCE_REPO" ]; then
            echo "::error::secret SOURCE_REPO is not set (expected owner/repo)"
            exit 1
          fi

      - name: Check out the source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          # Read-only on the private repo; the workflow never pushes source anywhere.
          token: ${{ secrets.SOURCE_TOKEN }}
          # The ref is the source repository's own: the build comes from main unless given.
          ref: ${{ inputs.source_ref || 'main' }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Record the version
        shell: bash
        # This repo has no package.json, so the version travels with the artifacts.
        run: node -p "require('./package.json').version" > version.txt

      - name: Build renderer and main
        run: bun run vite:build:app

      - name: Compile main entry to bytecode
        # Must run through Electron's own V8 — bytecode from Node's V8 is rejected at
        # launch with `cachedDataRejected`.
        run: bun run bytenode:compile

      - name: Package and publish
        shell: bash
        env:
          # Default token: the release lands in this repository.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH: ${{ inputs.publish }}
        # Linux builds AppImage and deb; `snap` needs snapcraft credentials and would fail
        # the whole job.
        run: |
          if [ "$PUBLISH" = "true" ]; then MODE=always; else MODE=never; fi
          TARGETS=""
          if [ "${{ matrix.platform }}" = "linux" ]; then TARGETS="AppImage deb"; fi
          bunx electron-builder --${{ matrix.platform }} $TARGETS --publish "$MODE"

      - name: Keep the installers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motus-${{ matrix.artifact }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/latest*.yml
            version.txt
          if-no-files-found: warn
          retention-days: 14

  checksums:
    name: Checksums
    # Only when every platform built; a partial set would list hashes for files that are
    # not all on the release page, which is worse than none.
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Compute SHA256 for every installer
        run: |
          cd artifacts
          find . -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' -o -name '*.AppImage' -o -name '*.deb' \) \
            -print0 | sort -z | xargs -0 sha256sum \
            | awk '{ name = $2; sub(/.*\//, "", name); print $1 "  " name }' > ../SHA256SUMS.txt
          cat ../SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS
          path: SHA256SUMS.txt
          retention-days: 14

      - name: Attach it to the release
        # Publishing is only possible from a manual run, so that input is the whole test.
        if: inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(cat artifacts/*/version.txt | head -1)
          gh release upload "v${version}" SHA256SUMS.txt --clobber --repo "${{ github.repository }}"
